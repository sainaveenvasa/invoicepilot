{% extends "base.html" %}
{% block title %}Choose a new password · InvoicePilot{% endblock %}
{% block content %}
{% if validlink %}
  <h1>Choose a new password</h1>
  <form method="post" novalidate>
    {% csrf_token %}
    {{ form.as_div }}
    <button type="submit">Change password</button>
  </form>
{% else %}
  <h1>This link is invalid or has expired</h1>
  <p><a href="{% url 'accounts:password_reset' %}">Request a new reset link</a>.</p>
{% endif %}
{% endblock %}
