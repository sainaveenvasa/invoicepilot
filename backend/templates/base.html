<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}InvoicePilot{% endblock %}</title>
</head>
<body>
  <header>
    <nav>
      <a href="{% url 'app:dashboard' %}">InvoicePilot</a>
      {% if user.is_authenticated %}
        <a href="{% url 'app:workspace_list' %}">Workspaces</a>
        <form method="post" action="{% url 'accounts:logout' %}">
          {% csrf_token %}
          <button type="submit">Sign out</button>
        </form>
      {% else %}
        <a href="{% url 'accounts:login' %}">Sign in</a>
        <a href="{% url 'accounts:signup' %}">Create account</a>
      {% endif %}
    </nav>
  </header>
  <main>
    {% if messages %}
      <ul class="messages">
        {% for message in messages %}<li class="{{ message.tags }}">{{ message }}</li>{% endfor %}
      </ul>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
